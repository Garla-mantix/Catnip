<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Cat Shop - Cart</title>
  <link rel="stylesheet" href="../styles/global.css">
  <link rel="stylesheet" href="../styles/cart.css">
  <script src="../scripts.js" defer></script>
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="nav-brand">
      <a href="../index.html"><span>Cat</span>Shop</a>
    </div>
    <button class="nav-toggle" aria-label="Menu">
      <span class="hamburger"></span>
    </button>
    <nav>
      <ul class="nav-links">
        <li><a href="../index.html">Home</a></li>
        <li><a href="cats.html">Cats</a></li>
        <li><a href="about.html">About</a></li>
        <li>
          <a href="cart.html" class="cart-link active">
            Cart
            <span class="cart-badge" id="cart-count">0</span>
          </a>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <!-- Header -->
    <header class="page-header">
      <h1>Cart</h1>
    </header>

    <!-- Empty cart -->
    <section class="cart-empty" id="cart-empty">
      <div class="cart-empty-icon" aria-hidden="true">🛒</div>
      <h2>Your cart is empty</h2>
      <p>You haven't added any cats yet. Explore our cats and find your favourite!</p>
      <a href="cats.html" class="btn btn-primary">Explore cats</a>
    </section>

    <!-- Cart with items -->
    <section class="cart-items" id="cart-items">
      <!-- Cart items -->
    </section>

    <!-- Order form -->
    <section class="order-form">
      <h2>Order</h2>
      <form id="order-form">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your full name" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@email.com" required>
        </div>
        <div class="form-group">
          <label for="address">Delivery address</label>
          <textarea id="address" name="address" placeholder="Street address, postal code and city" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Place order</button>
      </form>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 The Cat Shop. All rights reserved.</p>
  </footer>

</body>
</html>
